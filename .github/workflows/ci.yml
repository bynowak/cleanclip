name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for extension acceptance
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify unpacked extension
        if: runner.os == 'Linux'
        run: pnpm verify:extension
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: cleanclip-${{ runner.os }}
          path: artifacts/*.zip

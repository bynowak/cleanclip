name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (must match manifest version)
        required: true
        default: v1.0.0
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:extension
      - run: node scripts/package.mjs
      - name: Validate version and checksum
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).version")"
          cd artifacts
          sha256sum *.zip > SHA256SUMS
      - name: Create source and extension release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/SHA256SUMS --target "$GITHUB_SHA" --title "CleanClip $RELEASE_TAG" --notes-file CHANGELOG.md
